<!-- Archive confirmation stays in context while preserving the normal POST archive workflow. -->
<div class="modal fade destructive-confirmation-modal" id="confirm-archive-modal" tabindex="-1" role="dialog"
     aria-labelledby="confirm-archive-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <form id="confirm-archive-form" method="post" class="modal-content">
      {% csrf_token %}
      <div class="modal-header">
        <div>
          <span class="detail-eyebrow">Close out report</span>
          <h5 class="modal-title" id="confirm-archive-modal-label">Archive report?</h5>
        </div>
        <button type="button" class="btn-close destructive-confirmation-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="destructive-confirmation-copy">Archive <strong id="confirm-archive-report-title"></strong> and create a downloadable closeout package.</p>
        <div class="destructive-confirmation-warning" role="note">
          <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
          <p>Ghostwriter generates all report files and saves them alongside evidence in the archive, then marks the report complete and delivered. <strong>Evidence files are deleted off the disk.</strong></p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger"><i class="fas fa-archive" aria-hidden="true"></i> Archive report</button>
      </div>
    </form>
  </div>
</div>

<script>
  document.getElementById('confirm-archive-modal').addEventListener('show.bs.modal', function (event) {
    const archiveForm = document.getElementById('confirm-archive-form');
    const archiveTitle = document.getElementById('confirm-archive-report-title');
    const trigger = event.relatedTarget;
    archiveForm.removeAttribute('action');

    if (!(trigger instanceof HTMLElement) || !trigger.dataset.archiveUrl) {
      event.preventDefault();
      return;
    }

    let archiveUrl;
    try {
      archiveUrl = new URL(trigger.dataset.archiveUrl, window.location.origin);
    } catch {
      event.preventDefault();
      return;
    }

    if (archiveUrl.origin !== window.location.origin) {
      event.preventDefault();
      return;
    }

    archiveForm.action = `${archiveUrl.pathname}${archiveUrl.search}`;
    archiveTitle.textContent = trigger.dataset.archiveTitle || 'this report';
  });

  $('[data-archive-tooltip]').each(function () {
    bootstrap.Tooltip.getOrCreateInstance(this);
  });
</script>
