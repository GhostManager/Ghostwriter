{% extends "account/base.html" %}

{% load i18n %}
{% load crispy_forms_tags %}

{% block inner %}
    <div class="auth-challenge-heading">
        <span class="auth-challenge-icon auth-journey-icon" aria-hidden="true"><i class="fas fa-key"></i></span>
        <div>
            <span class="auth-challenge-eyebrow">{% trans "Account setup" %}</span>
            <h1 id="password-set-heading">{% trans "Set a password" %}</h1>
            <p>{% trans "Set a password for signing in when another method is unavailable." %}</p>
        </div>
    </div>

    <form method="POST" action="{% url 'account_set_password' %}" class="password_set auth-journey-form" aria-labelledby="password-set-heading">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="auth-journey-actions">
            <button class="btn btn-primary auth-challenge-submit" type="submit" name="action"><i class="fas fa-key" aria-hidden="true"></i> {% trans "Set password" %}</button>
        </div>
    </form>
{% endblock %}
