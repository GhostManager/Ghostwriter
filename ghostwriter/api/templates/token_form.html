{% extends "base_generic.html" %}
{% load crispy_forms_tags %}

{% block pagetitle %}API Token Creation{% endblock %}


{% block content %}
    <!-- Form Error Section -->
    {% if form.errors %}
        <script>
            {% for field in form %}
                {% for error in field.errors %}
                    displayToastTop({type:'error', string:'{{ error|escapejs }}', context:'form'});
                {% endfor %}
            {% endfor %}
            {% for error in form.non_field_errors %}
                displayToastTop({type:'error', string:'{{ error|escapejs }}', context:'form'});
            {% endfor %}
        </script>
    {% endif %}

    <div class="resource-form-shell token-create-editor">
        {% crispy form form.helper %}
    </div>
{% endblock %}
