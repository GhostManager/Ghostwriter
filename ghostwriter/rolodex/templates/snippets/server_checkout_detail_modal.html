{% load bleach_tags %}

<div id="server_checkout_detail_{{ checkout.id }}" class="modal fade detail-preview-modal" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-super-sized modal-dialog-scrollable modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <span class="detail-preview-modal-eyebrow">Server checkout</span>
          <h2 class="modal-title">Checkout notes</h2>
        </div>
        <button type="button" class="btn-close detail-preview-modal-close" data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>
      <div class="modal-body">
        {% if checkout.description %}
          {{ checkout.description|bleach|safe }}
        {% else %}
          <p>No one has added a description for this checkout. <a class="clickable" href="{% url 'shepherd:server_history_update' checkout.id %}">Fix that here.</a></p>
        {% endif %}
      </div>
      <div class="modal-footer detail-preview-modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
