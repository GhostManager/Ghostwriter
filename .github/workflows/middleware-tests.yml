name: Middleware API Tests

concurrency:
  group: middleware-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/middleware-tests.yml"
      - "compose/production/middleware-api/**"
      - "ghostwriter/**/migrations/**"
      - "ghostwriter/**/models.py"
      - "hasura-docker/metadata/**"
  pull_request:
    paths:
      - ".github/workflows/middleware-tests.yml"
      - "compose/production/middleware-api/**"
      - "ghostwriter/**/migrations/**"
      - "ghostwriter/**/models.py"
      - "hasura-docker/metadata/**"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: compose/production/middleware-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: compose/production/middleware-api
        run: pytest -v

  graphql-schema:
    name: GraphQL schema compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build environment
        run: |
          chmod +x ghostwriter-cli-linux
          ./ghostwriter-cli-linux install --mode local-dev

      - name: Wait for application services
        run: |
          docker compose -f local.yml up -d --wait --wait-timeout 300 postgres redis frontend django
          docker compose -f local.yml up -d --force-recreate --wait --wait-timeout 300 graphql_engine

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install graphql-core requests

      - name: Validate middleware GraphQL documents
        run: |
          secret="$(docker compose -f local.yml exec -T graphql_engine printenv HASURA_GRAPHQL_ADMIN_SECRET | tr -d '\r\n')"
          python compose/production/middleware-api/validate_graphql.py \
            --url http://localhost:8080/v1/graphql \
            --admin-secret "$secret" \
            --app compose/production/middleware-api/app.py

      - name: Get GraphQL service logs
        if: failure()
        run: |
          docker compose -f local.yml logs graphql_engine > graphql-engine-logs.txt
          docker compose -f local.yml logs django > django-logs.txt

      - name: Upload service logs artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: middleware-graphql-service-logs
          path: |
            graphql-engine-logs.txt
            django-logs.txt
